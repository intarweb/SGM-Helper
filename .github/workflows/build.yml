# Canonical intarweb build workflow — the ONLY workflow a repo needs to produce
# ghcr.io/intarweb/<repo>:latest. No logic here: everything (fork sync, PR
# folding, fingerprint/no-op, build) lives in the shared workflow it calls.
# This file is identical in every repo by construction — operations' build step
# re-asserts this exact copy onto a fork's mirror main after every sync.
#
#   FORK:       main is synced to the upstream default branch; every open
#               intarweb→upstream PR is folded into the built image. Rebuilds
#               six-hourly when a PR is opened, a PR branch moves, or upstream
#               moves (see schedule). A PR against the fork itself is NOT
#               folded — upstream is the only transport.
#   GREENFIELD: every push to the default branch builds :latest.
# Shared logic: intarweb/operations/.github/workflows/build.yml (public repo —
# reusable workflows resolve + unlimited Actions minutes).

name: build

on:
  push:                    # any branch push — but only fires where THIS FILE
                           # is on the branch. The mirror prunes it from main
                           # except on main, so a branch cut after the prune
                           # carries nothing and cannot self-fold; see the
                           # schedule below, which is the safety net.
  pull_request:            # PRs opened AGAINST the fork (fork-internal PRs)
  schedule:
    # The fold's backstop, not its main trigger. There is no seed step (removed
    # in F1): nothing writes build.yml onto a PR branch, so a push to one of
    # those branches starts no fold here — and GitHub fires NO event on the fork
    # when an intarweb->upstream PR is opened. So this is what picks up a new or
    # updated PR that no push hook dispatched.
    #
    # COST — why the interval and the offset: every tick boots a runner that
    # checks out full history, syncs, fingerprints and usually finds nothing to
    # do, whether or not the fingerprint moved. Multiplied by the pool that is
    # what GitHub counts, and it throttled a fork for it ("Workflows are not
    # currently being run on this fork due to the scale of GitHub Actions
    # usage"). Six-hourly with a per-repo minute offset keeps 23 forks off the
    # same minute. The pre-push dispatch hook is what catches a push within
    # seconds; this cadence is the floor under everything else.
    #
    # The minute is a placeholder. The sync step in
    # .github/workflows/build.yml rewrites it per repo at sync time — this file
    # is byte-identical in every fork by construction, so a repo cannot carry
    # its own literal here.
    - cron: '49 */6 * * *'   # 6-hourly re-sync + fold, per-repo minute
  workflow_dispatch:

permissions:
  contents: write   # shared workflow re-applies this overlay on fork mirror main
  packages: write   # GHCR push

jobs:
  publish:
    uses: intarweb/operations/.github/workflows/build.yml@main
    secrets: inherit
